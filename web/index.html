<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVE Fitting Advisor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>EVE Fitting Advisor</h1>
    </div>
    <div class="controls-bar">
      <label class="ctrl">
        <span>Skills</span>
        <select id="skills-select">
          <option value="all5">All V (Preset)</option>
          <option value="all0">All 0 (Preset)</option>
        </select>
      </label>
      <label class="ctrl">
        <span>Profile</span>
        <select id="profile-select"></select>
      </label>
      <button id="btn-sample" class="btn btn-ghost" type="button">Load Sample Fit</button>
    </div>
  </header>

  <main class="workspace">
    <!-- Left column: EFT Input & Export -->
    <section class="panel input-panel">
      <div class="panel-header">
        <h2>EFT Fit Input</h2>
        <button id="btn-copy-eft" class="btn btn-ghost btn-sm" type="button">Copy EFT</button>
      </div>
      <textarea id="eft-input" spellcheck="false" placeholder="Paste an EFT fit here, e.g.&#10;[Rifter, My Fit]&#10;Damage Control II&#10;..."></textarea>
      <div class="action-row">
        <button id="btn-calc" class="btn btn-primary" type="button">Calculate Fit</button>
        <button id="btn-advise" class="btn btn-accent" type="button">Run Advisor</button>
      </div>
      <div id="error-box" class="alert alert-error hidden"></div>
      <div id="validation-box" class="alert alert-warn hidden"></div>
    </section>

    <!-- Center column: SVG Fitting Wheel -->
    <section class="panel wheel-panel">
      <div class="panel-header">
        <h2 id="fit-title">No Fit Loaded</h2>
        <span id="fit-cost" class="badge">price unknown</span>
      </div>
      <div class="wheel-wrap">
        <svg id="fitting-wheel" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ship Fitting Wheel">
          <defs>
            <clipPath id="ship-clip">
              <circle cx="260" cy="260" r="118" />
            </clipPath>
            <radialGradient id="wheel-bg" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#132238" />
              <stop offset="70%" stop-color="#0b1320" />
              <stop offset="100%" stop-color="#070c14" />
            </radialGradient>
          </defs>
          <circle cx="260" cy="260" r="245" fill="url(#wheel-bg)" stroke="#1f3149" stroke-width="2" />
          <circle cx="260" cy="260" r="196" fill="none" stroke="#1b2b42" stroke-width="1" stroke-dasharray="4 4" />
          <circle cx="260" cy="260" r="122" fill="#09101b" stroke="#2c4668" stroke-width="2" />
          <image id="ship-render" x="142" y="142" width="236" height="236" clip-path="url(#ship-clip)" preserveAspectRatio="xMidYMid slice" href="/api/images/render/0" />
          <g id="wheel-arcs"></g>
          <g id="wheel-slots"></g>
        </svg>
        <div id="slot-tooltip" class="tooltip hidden"></div>
      </div>

      <!-- Resource Bars: CPU, Powergrid, Calibration -->
      <div class="resources">
        <div class="res-row">
          <div class="res-label"><span>CPU</span><span id="res-cpu-text">0 / 0 tf</span></div>
          <div class="bar-track"><div id="res-cpu-bar" class="bar-fill bar-cpu" style="width:0%"></div></div>
        </div>
        <div class="res-row">
          <div class="res-label"><span>Powergrid</span><span id="res-pg-text">0 / 0 MW</span></div>
          <div class="bar-track"><div id="res-pg-bar" class="bar-fill bar-pg" style="width:0%"></div></div>
        </div>
        <div class="res-row">
          <div class="res-label"><span>Calibration</span><span id="res-cal-text">0 / 0</span></div>
          <div class="bar-track"><div id="res-cal-bar" class="bar-fill bar-cal" style="width:0%"></div></div>
        </div>
      </div>
    </section>

    <!-- Right column: Engine Stats -->
    <section class="panel stats-panel">
      <div class="panel-header">
        <h2>Engine Statistics</h2>
        <span id="cap-badge" class="badge">—</span>
      </div>
      <div id="stats-content" class="stats-grid">
        <p class="muted">Calculate a fit to see engine statistics.</p>
      </div>
    </section>
  </main>

  <!-- Advisor Recommendations Section -->
  <section id="advisor-section" class="panel advisor-panel hidden">
    <div class="panel-header">
      <h2>Advisor Recommendations</h2>
      <span id="advisor-meta" class="muted"></span>
    </div>
    <p id="advisor-summary" class="advisor-summary"></p>
    <div id="advisor-cards" class="compare-grid"></div>
  </section>

  <footer class="footer">
    <span>EVE Fitting Advisor — Engine-only maths via Pyfa <code>eos</code></span>
    <span id="version-footer">Pyfa: loading... | Gamedata: loading...</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
