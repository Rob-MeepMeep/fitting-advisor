[project]
name = "fitting-advisor"
version = "0.1.0"
description = "Standalone local EVE Online ship fitting analyser and advisor powered by Pyfa's eos engine"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"

# Pyfa's exact dependency pins (from vendor/pyfa/pyproject.toml, excluding wxPython)
# plus fitting-advisor's own dependencies.
dependencies = [
    # --- Pyfa pinned dependencies (DO NOT UPGRADE) ---
    "logbook==1.9.2",
    "numpy==2.5.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "sqlalchemy==2.0.51",
    "cryptography==50.0.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography==48.0.1 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "markdown2==2.5.5",
    "packaging==26.2",
    "roman==5.2",
    "beautifulsoup4==4.15.0",
    "pyyaml==6.0.3",
    "python-jose==3.5.0",
    "requests-cache==1.3.3",
    # --- fitting-advisor dependencies ---
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
indent-width = 4
exclude = ["vendor"]
